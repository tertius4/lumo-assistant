<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="/*CSS_URI*/" />
    <title>Lumo</title>
  </head>
  <body>
    <div id="header">
      <div id="logo-container">
        <div class="logo-bg"></div>
        <img id="logo-img" src="/*SVG_URI*/" alt="Lumo" />
      </div>
      <button id="clear-btn">Clear Chat</button>
    </div>
    <div id="context-bar">
      <span id="workspace-info">Waiting for workspace...</span>
    </div>
    <div id="chat-container">
      <div id="welcome-message">
        <h2>Hey, I'm Lumo. Ask me anything.</h2>
      </div>
    </div>
    <div id="input-container">
      <textarea id="message-input" placeholder="Speak to me, Commander..."></textarea>
      <div id="send-button-container">
        <button id="send-button">Send</button>
      </div>
    </div>
    <script>
      window.initialMessages = /*INITIAL_MESSAGES*/;
    </script>
    <script src="/*JS_URI*/"></script>
  </body>
</html>
